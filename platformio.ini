[platformio]
src_dir = ClimateCamera_1_2_1_IDE1819

[env:esp32dev]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
board_build.partitions = min_spiffs.csv
monitor_speed = 115200
lib_deps = bodmer/TFT_eSPI@2.5.43
build_flags = -DUSER_SETUP_LOADED=1 -include $PROJECT_DIR/ClimateCamera_1_2_1_IDE1819/User_Setup.h
